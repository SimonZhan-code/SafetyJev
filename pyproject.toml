[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "safetyjev"
version = "0.1.0"
description = "Shadow evaluation of constraint-conditioned safety forecasts on ManiGuard"
requires-python = ">=3.9"
dependencies = []

[project.optional-dependencies]
data = ["numpy>=1.24", "av>=12", "Pillow>=9"]
train-data = ["numpy>=1.24", "av>=12", "Pillow>=9", "torch>=2"]

[project.scripts]
safetyjev = "safetyjev.cli:main"

[tool.setuptools.packages.find]
include = ["safetyjev*"]
